name: poll
on:
  schedule:
    - cron: "*/6 * * * *"   # 10/saat = GitHub Pages build limitinin tamamı
  workflow_dispatch:

permissions:
  contents: write

concurrency: poll          # a slow run must never race the next one into a bad merge

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin      # must match the zone the local history was written in (CEST)
      TUYA_REGION: ${{ secrets.TUYA_REGION }}
      TUYA_KEY: ${{ secrets.TUYA_KEY }}
      TUYA_SECRET: ${{ secrets.TUYA_SECRET }}
      TUYA_DEVICE: ${{ secrets.TUYA_DEVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install tinytuya
      - run: python poll.py
      - run: |
          git config user.name  "poopy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add events.jsonl api/data.json
          git diff --cached --quiet || git commit -m "poll $(date -Iseconds)"
          git push
