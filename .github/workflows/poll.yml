name: poll
on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub scheduled runs get dropped/delayed for hours;
  workflow_dispatch:         # the 6 dk cadence lives in the loop below, not in cron

permissions:
  contents: write

concurrency: poll          # a slow run must never race the next one into a bad merge

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      TZ: Europe/Berlin      # must match the zone the local history was written in (CEST)
      TUYA_REGION: ${{ secrets.TUYA_REGION }}
      TUYA_KEY: ${{ secrets.TUYA_KEY }}
      TUYA_SECRET: ${{ secrets.TUYA_SECRET }}
      TUYA_DEVICE: ${{ secrets.TUYA_DEVICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install tinytuya
      - name: poll 10x, 6 dk arayla
        run: |
          git config user.name  "poopy-bot"
          git config user.email "bot@users.noreply.github.com"
          for i in $(seq 10); do
            if python poll.py; then
              git add events.jsonl device_log.jsonl api/data.json
              git diff --cached --quiet || { git commit -q -m "poll $(date -Iseconds)"; git pull --rebase -q; git push -q; }
            fi
            if [ "$i" -lt 10 ]; then sleep 340; fi
          done
