<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sütlaç Poopy">
<meta name="theme-color" content="#F4E8D7">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<title>Sütlaç Poopy</title>
<style>
:root{
  --page:#F4E8D7; --card:#FFFBF4; --espresso:#2A1F1A; --card-2:#FBEFDC;
  --ink:#2A1F1A; --muted:#8C7A67; --muted-dark:#C9B69C;
  --orange:#C2571F; --butter:#F0B34E; --peach:#E8825A; --olive:#7E8F3C;
  --shadow:0 10px 30px rgba(96,62,26,.10);
  --shadow-lift:0 20px 46px rgba(96,62,26,.18);
  --cat-w:min(268px,40vw);
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
*{box-sizing:border-box}
/* standalone modda çubuk yok: kenar boşlukları çentik ve home
   indicator'ından gelmeli, sabit 20px'ten değil */
:root{--gut:max(20px,env(safe-area-inset-left),env(safe-area-inset-right))}
html{-webkit-font-smoothing:antialiased;background:var(--page);
  -webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--ink);
  font:400 17px/1.5 var(--sans);letter-spacing:-.2px}
.wrap{max-width:960px;margin:0 auto;padding:0 var(--gut)}

header{position:sticky;top:0;z-index:30;padding:14px var(--gut);
  background:rgba(244,232,215,.82);backdrop-filter:saturate(180%) blur(14px)}
.bar{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar img{width:42px;height:42px;
  transition:transform .45s var(--ease)}
@media (hover:hover){.bar img:hover{transform:rotate(-8deg) scale(1.08)}}
.bar .nm{font-weight:750;font-size:19px;letter-spacing:-.5px}
.rf{margin-left:auto;border:0;cursor:pointer;width:42px;height:42px;
  border-radius:9999px;background:var(--card);color:var(--muted);
  box-shadow:var(--shadow);display:grid;place-items:center;
  font:inherit;transition:transform .45s var(--ease)}
.rf:disabled{cursor:progress}
.rf svg{width:20px;height:20px}
.rf[data-busy] svg{animation:spin .9s linear infinite}
@media (hover:hover){.rf:hover{transform:rotate(-30deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rf,.rf[data-busy] svg{transition:none;animation:none}}

.alert{background:#FBE3DD;color:#8C2A18;border-radius:22px;padding:16px 22px;
  margin-top:20px;font-weight:700;box-shadow:var(--shadow)}

/* ---- hero ---- */
.hero{position:relative;margin:8px auto 0;background:var(--card);
  border-radius:36px;box-shadow:var(--shadow);padding:44px;
  min-height:366px;overflow:visible}
.hero::before{content:"";position:absolute;right:2%;bottom:-4%;width:56%;height:86%;
  border-radius:9999px;background:radial-gradient(closest-side,rgba(240,179,78,.30),transparent 72%);
  pointer-events:none}
.eyebrow{margin:0;font-weight:750;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--orange)}
.big{margin:4px 0 0;font-weight:800;font-size:132px;line-height:.92;
  letter-spacing:-6px;font-variant-numeric:tabular-nums;position:relative}
.big-u{display:block;font-weight:700;font-size:26px;letter-spacing:-.6px;
  line-height:1.2;margin-top:6px;max-width:9ch}
.when{margin:18px 0 0;color:var(--muted);font-size:16px;font-weight:550;position:relative}
.inout{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);
  color:var(--orange);border-radius:9999px;padding:4px 12px;font-size:14px;
  font-weight:750;margin-left:6px;white-space:nowrap}
.inout b{font-weight:800}
.cat{position:absolute;right:18px;bottom:-52px;width:var(--cat-w);
  filter:drop-shadow(0 14px 22px rgba(96,62,26,.24));pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 76%,transparent 99%);
  mask-image:linear-gradient(to bottom,#000 76%,transparent 99%)}

/* ---- stickers ---- */
.stickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;margin:78px auto 0}
.sticker{background:var(--card);border-radius:22px;padding:20px 22px;
  box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
@media (hover:hover){
  .sticker:hover{transform:translateY(-5px);box-shadow:var(--shadow-lift)}}
.sticker:nth-child(2){background:var(--card-2)}
.sticker .v{font-weight:800;font-size:36px;letter-spacing:-1.4px;line-height:1.05;
  font-variant-numeric:tabular-nums}
.sticker .k{margin-top:4px;color:var(--muted);font-size:14px;font-weight:600}

/* ---- sağlık durumu + günlük sayaç ---- */
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));
  gap:14px;margin-top:14px}
.state{border-radius:22px;padding:20px 22px;box-shadow:var(--shadow);
  display:flex;align-items:flex-start;gap:12px;font-weight:750}
.state .dot{width:12px;height:12px;border-radius:9999px;background:currentColor;
  flex:none;margin-top:6px}
.state.ok{background:#E9F0D8;color:#4C5D19}
.state.uyari{background:#FBEFDC;color:#8A5A12}
.state.acil{background:#FBE3DD;color:#8C2A18}
.state ul{margin:7px 0 0;padding-left:17px;font-weight:650;font-size:15px}
.state li+li{margin-top:3px}
.tally{display:flex;gap:14px}
.tile{flex:1;min-width:0;border-radius:22px;padding:18px 20px;position:relative;
  overflow:hidden;box-shadow:var(--shadow);color:var(--espresso);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
@media (hover:hover){.tile:hover{transform:translateY(-5px);box-shadow:var(--shadow-lift)}}
.tile.pee{background:linear-gradient(158deg,#FFF3D8,#F7DFA6)}
.tile.poo{background:linear-gradient(158deg,#F3E4D3,#DEC4A6)}
.tile .ico{width:40px;height:40px;border-radius:9999px;display:grid;place-items:center;
  background:rgba(255,255,255,.62);box-shadow:0 4px 12px rgba(96,62,26,.12)}
.tile .ico svg{width:23px;height:23px;fill:currentColor;display:block}
.tile.pee .ico{color:#C98A12}
.tile.poo .ico{color:#7A5334}
.tile .v{margin-top:12px;font-weight:800;font-size:38px;letter-spacing:-1.5px;
  line-height:1;font-variant-numeric:tabular-nums}
.tile .k{margin-top:3px;font-size:14px;font-weight:700;opacity:.62}
.tile .tm{margin-top:8px;font-size:13px;font-weight:700;opacity:.8;
  line-height:1.4;word-break:break-word}
.tile .bg{position:absolute;right:-16px;bottom:-22px;width:104px;height:104px;
  opacity:.16;fill:currentColor;pointer-events:none}
.tile.pee .bg{color:#C98A12}
.tile.poo .bg{color:#7A5334}
.tally .v{font-weight:800;font-size:36px;letter-spacing:-1.4px;line-height:1.05;
  font-variant-numeric:tabular-nums}
.tally .k{margin-top:4px;color:var(--muted);font-size:14px;font-weight:600}

/* ---- chart cards ---- */
.card{background:var(--card);border-radius:30px;padding:34px;margin-top:20px;
  box-shadow:var(--shadow)}
.card.dark{background:var(--espresso);color:#FFF6E9}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.card h2{margin:0;font-weight:780;font-size:31px;letter-spacing:-1px}
.legend{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  color:var(--muted);font-size:13px;font-weight:650}
.card.dark .legend{color:var(--muted-dark)}
.legend i{width:13px;height:13px;border-radius:9999px;border:2.5px solid var(--orange);
  background:var(--card);display:inline-block}
.card.dark .legend i{border-color:var(--butter);background:var(--espresso)}

.chart{position:relative;margin-top:22px;width:100%;max-width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;opacity:0;transform:translateY(4px);
  transition:opacity .15s,transform .15s;
  background:var(--espresso);color:#FFF6E9;border-radius:12px;padding:8px 14px;
  font-size:13px;font-weight:650;white-space:nowrap;z-index:5;
  box-shadow:0 8px 22px rgba(42,31,26,.3)}
.tip.on{opacity:1;transform:translateY(0)}
.card.dark .tip{background:#FFF6E9;color:var(--espresso)}
.empty{margin-top:22px;padding:40px;text-align:center;border-radius:20px;
  background:var(--card-2);color:var(--muted);font-weight:600}
.card.dark .empty{background:rgba(255,255,255,.06);color:var(--muted-dark)}

footer{text-align:center;color:var(--muted);font-size:13px;font-weight:550;
  padding:44px var(--gut) calc(56px + env(safe-area-inset-bottom))}

/* ---- motion ---- */
@media (prefers-reduced-motion:no-preference){
  .reveal{opacity:0;transform:translateY(22px)}
  .reveal.in{opacity:1;transform:none;
    transition:opacity .7s var(--ease),transform .7s var(--ease)}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .cat{animation:floaty 6.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-6deg)}}
  .tile .ico svg{animation:bob 4.5s ease-in-out infinite}
  .tile.poo .ico svg{animation-delay:.9s}
  @keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
  .anim .bar{transform-box:fill-box;transform-origin:50% 100%;
    animation:grow .75s var(--ease) backwards}
  @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  .anim .line{stroke-dasharray:var(--len);animation:draw 1.25s var(--ease) backwards}
  @keyframes pt-in{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
  .anim .pt{transform-box:fill-box;transform-origin:50% 50%;
    animation:pt-in .45s var(--ease) backwards}
}

@media (max-width:760px){
  /* Sütlaç mobilde de kenardan taşsın — ortalanınca yine portreye dönüyor */
  .hero{padding:30px 24px 34px;padding-right:calc(var(--cat-w) - 16px);min-height:308px}
  .big{font-size:88px;letter-spacing:-3.5px}
  .big-u{font-size:20px}
  .when{font-size:14px}
  .cat{right:-4px;bottom:-38px}
  .stickers{margin-top:52px}
  .card{padding:26px 22px;border-radius:26px}
  .card h2{font-size:26px}
  .legend{margin-left:0;width:100%}
}
</style>
</head>
<body>

<header><div class="bar">
  <img src="favicon.png" alt="Sütlaç">
  <span class="nm">Sütlaç Poopy</span>
  <button class="rf" id="refresh" title="Yenile" aria-label="Verileri yenile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 11a8 8 0 1 0-.7 4.5"/><path d="M20 4v7h-7"/>
    </svg>
  </button>
</div></header>

<div class="wrap">
  <div id="alert"></div>

  <div class="hero">
    <p class="eyebrow">bugün</p>
    <p class="big"><span id="big">–</span><span class="big-u" id="bigu">kez gitti</span></p>
    <p class="when" id="when">&nbsp;</p>
    <img class="cat" src="sutlac.png" alt="Sütlaç">
  </div>

  <div class="stickers" id="stickers"></div>

  <div class="health" id="health"></div>

  <div class="card reveal"><div class="head"><h2>Günde kaç kez?</h2></div>
    <div class="chart" id="cVisits"></div></div>

  <div class="card dark reveal"><div class="head"><h2>Ne kadar oyalanıyor?</h2>
    <span class="legend"><i></i> girdili çıktılı</span></div>
    <div class="chart" id="cDur"></div></div>

  <div class="card reveal"><div class="head"><h2>Kaç kilo?</h2></div>
    <div class="chart" id="cWeight"></div></div>

  <div class="card reveal"><div class="head"><h2>Makine kaç kez döndü?</h2></div>
    <div class="chart" id="cCleans"></div></div>
</div>

<footer id="foot"></footer>
<script>
const $ = s => document.querySelector(s);
const d2 = n => String(n).padStart(2, "0");
const fmtS = s => s == null ? "–" : s < 60 ? s + " sn"
  : Math.floor(s / 60) + " dk " + d2(Math.round(s % 60)) + " sn";
const hhmm = t => { const d = new Date(t); return d2(d.getHours()) + ":" + d2(d.getMinutes()); };
const dmy = t => { const d = new Date(t); return d2(d.getDate()) + "." + d2(d.getMonth() + 1); };
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

// damla ve üç katlı yığın: emoji yerine kendi çizimimiz, tema rengine uyuyor
const ICO = {
  pee: `<path d="M12 2.6c3.7 4.3 6.1 7.4 6.1 10.4a6.1 6.1 0 0 1-12.2 0c0-3 2.4-6.1 6.1-10.4z"/>`,
  poo: `<ellipse cx="12" cy="18.4" rx="7.5" ry="3.4"/><ellipse cx="12" cy="13.4" rx="5.5" ry="3.1"/>`
     + `<ellipse cx="12" cy="8.9" rx="3.5" ry="2.5"/>`
     + `<path d="M12 6.4c0-1.8 1.4-2.2 1.1-4.1" fill="none" stroke="currentColor"`
     + ` stroke-width="1.7" stroke-linecap="round"/>`,
};
const svg = (k, cls) => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`;
const tile = (k, ad, n, tm) => `<div class="tile ${k}">
  <div class="ico">${svg(k, "")}</div>
  <div class="v">${n}</div><div class="k">${ad}</div><div class="tm">${tm}</div>
  ${svg(k, "bg")}</div>`;

function ago(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 90) return "az önce";
  const m = Math.round(s / 60); if (m < 60) return m + " dakika önce";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " saat" + (m % 60 >= 5 ? ` ${m % 60} dakika` : "") + " önce";
  const d = Math.floor(h / 24);
  return d === 1 ? "dün" : d + " gün önce";
}

function byDay(items) {
  if (!items.length) return [];
  const m = {};
  items.forEach(i => { const k = i.ts.slice(0, 10); m[k] = (m[k] || 0) + 1; });
  const keys = Object.keys(m).sort(), out = [];
  const cur = new Date(keys[0]), end = new Date(keys[keys.length - 1]);
  while (cur <= end) {
    const k = cur.toISOString().slice(0, 10);
    out.push({k, v: m[k] || 0});
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

function niceNum(x, round) {
  const e = Math.floor(Math.log10(x)), f = x / Math.pow(10, e);
  const nf = round ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10)
                   : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
  return nf * Math.pow(10, e);
}
function niceScale(lo, hi, n) {
  const step = niceNum(niceNum(hi - lo, false) / n, true);
  return {min: Math.floor(lo / step) * step, max: Math.ceil(hi / step) * step, step};
}

const NS = "http://www.w3.org/2000/svg";
const el = (t, a) => { const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]); return n; };

function drawChart(host, o) {
  host.innerHTML = "";
  if (!o.points.length) {
    const d = document.createElement("div");
    d.className = "empty"; d.textContent = o.empty || "Henüz veri yok.";
    host.appendChild(d); return;
  }
  const dk = !!o.dark;
  // one mark hue per surface — no chart puts two series side by side, so these
  // are independent accents, not a categorical set. Both clear 3:1 on their card.
  const c     = dk ? "#F0B34E" : "#C2571F";
  const muted = dk ? "#C9B69C" : "#8C7A67";
  const grid  = dk ? "rgba(255,255,255,.10)" : "rgba(42,31,26,.09)";
  const axis  = dk ? "rgba(255,255,255,.26)" : "rgba(42,31,26,.22)";
  const surf  = dk ? "#2A1F1A" : "#FFFBF4";

  const W = Math.max(host.clientWidth || 640, 280), H = o.height || 250;
  const P = {t: 14, r: 12, b: 32, l: 46};
  const iw = W - P.l - P.r, ih = H - P.t - P.b, n = o.points.length;

  const ys = o.points.map(p => p.y);
  let lo = o.type === "bar" ? 0 : Math.min(...ys), hi = Math.max(...ys);
  if (hi === lo) { const g = Math.abs(hi) * .1 || .5; hi += g; if (o.type !== "bar") lo -= g; }
  const {min: ymin, max: ymax, step} = niceScale(lo, hi, 4);
  const dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
  const Y = v => P.t + ih - (v - ymin) / (ymax - ymin) * ih;
  const X = i => o.type === "bar" ? P.l + (i + .5) * (iw / n)
                                  : P.l + (n === 1 ? iw / 2 : i * (iw / (n - 1)));

  const svg = el("svg", {viewBox: `0 0 ${W} ${H}`, width: W, height: H,
                         role: "img", "aria-label": o.aria || ""});
  if (o.animate && !RM) svg.setAttribute("class", "anim");

  for (let v = ymin; v <= ymax + step / 2; v += step) {
    const y = Y(v), zero = Math.abs(v - ymin) < step / 2;
    svg.appendChild(el("line", {x1: P.l, x2: W - P.r, y1: y, y2: y,
      stroke: zero ? axis : grid, "stroke-width": zero ? 1.5 : 1}));
    const tx = el("text", {x: P.l - 10, y: y + 4, fill: muted, "text-anchor": "end",
      "font-size": 12, "font-weight": 600, "font-variant-numeric": "tabular-nums"});
    tx.textContent = o.yFmt ? o.yFmt(v) : v.toFixed(dec);
    svg.appendChild(tx);
  }

  let line = null;
  if (o.type === "bar") {
    const slot = iw / n, bw = Math.min(56, Math.max(6, slot - 12)), r = Math.min(9, bw / 2);
    o.points.forEach((p, i) => {
      if (!p.y) return;
      const x = X(i) - bw / 2, y = Y(p.y), h = Math.max(Y(ymin) - y, r);
      const rr = Math.min(r, h);
      const bar = el("path", {class: "bar", fill: c, d:
        `M${x},${y+h} L${x},${y+rr} Q${x},${y} ${x+rr},${y} L${x+bw-rr},${y}
         Q${x+bw},${y} ${x+bw},${y+rr} L${x+bw},${y+h} Z`});
      bar.style.animationDelay = (i * 60) + "ms";
      svg.appendChild(bar);
    });
  } else {
    line = el("path", {class: "line", fill: "none", stroke: c, "stroke-width": 3,
      "stroke-linejoin": "round", "stroke-linecap": "round",
      d: o.points.map((p, i) => (i ? "L" : "M") + X(i) + "," + Y(p.y)).join(" ")});
    svg.appendChild(line);
    if (n <= 60) o.points.forEach((p, i) => {
      // an in-and-out visit gets a hollow ring — shape, not colour, carries it
      const ring = p.parts > 1;
      const dot = el("circle", {class: "pt", cx: X(i), cy: Y(p.y),
        r: ring ? 6 : 4.5, fill: ring ? surf : c, stroke: ring ? c : surf,
        "stroke-width": ring ? 3 : 2.5});
      dot.style.animationDelay = (420 + i * 45) + "ms";
      svg.appendChild(dot);
    });
  }

  let lastX = -Infinity, lastTxt = null;
  o.points.forEach((p, i) => {
    const x = X(i);
    if (x - lastX < 58 || p.x === lastTxt) return;
    const tx = el("text", {x, y: H - 10, fill: muted, "text-anchor": "middle",
      "font-size": 12, "font-weight": 600});
    tx.textContent = p.x; svg.appendChild(tx);
    lastX = x; lastTxt = p.x;
  });

  const cross = el("line", {y1: P.t, y2: P.t + ih, stroke: axis, "stroke-width": 1.5, opacity: 0});
  svg.appendChild(cross);
  const hot = el("rect", {x: P.l, y: P.t, width: iw, height: ih, fill: "transparent"});
  svg.appendChild(hot);
  host.appendChild(svg);

  if (line) line.style.setProperty("--len", line.getTotalLength());

  const tip = document.createElement("div");
  tip.className = "tip"; host.appendChild(tip);
  hot.addEventListener("mousemove", ev => {
    const b = svg.getBoundingClientRect(), mx = (ev.clientX - b.left) * (W / b.width);
    let best = 0, bd = Infinity;
    o.points.forEach((p, i) => { const d = Math.abs(X(i) - mx); if (d < bd) { bd = d; best = i; } });
    const p = o.points[best], px = X(best), py = Y(p.y), sc = b.width / W;
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("opacity", 1);
    tip.innerHTML = `${o.tip ? o.tip(p) : p.y} · ${p.full || p.x}`;
    tip.classList.add("on");
    tip.style.left = Math.min(Math.max(px * sc - tip.offsetWidth / 2, 0), b.width - tip.offsetWidth) + "px";
    tip.style.top = Math.max(py * sc - tip.offsetHeight - 12, 0) + "px";
  });
  hot.addEventListener("mouseleave", () => {
    tip.classList.remove("on"); cross.setAttribute("opacity", 0);
  });
}

function countUp(node, to) {
  if (RM || !(to > 0)) { node.textContent = to ?? "–"; return; }
  const t0 = performance.now(), dur = 900;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur);
    node.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

let LAST = null, drawn = false;
function render(d) {
  LAST = d;
  const now = d.now, first = !drawn;
  $("#alert").innerHTML = now.faults.length
    ? `<div class="alert">Cihaz arıza bildiriyor: ${now.faults.join(", ")}</div>` : "";

  const v = now.visits_today;
  if (first) countUp($("#big"), v); else $("#big").textContent = v ?? "–";
  $("#bigu").textContent = "kez gitti";
  paintWhen();

  $("#stickers").innerHTML = [
    [fmtS(now.median_secs && Math.round(now.median_secs)), "medyan oyalanma"],
    [now.weight_kg ? now.weight_kg.toFixed(1) + " kg" : "–", "medyan ağırlık"],
    [d.visits.length, "toplam ziyaret"],
  ].concat(now.short_stays ? [[now.short_stays, "girip çıkmış (<10 sn)"]] : [])
   .map(([a, b]) => `<div class="sticker"><div class="v">${a}</div><div class="k">${b}</div></div>`).join("");

  const bad = now.alerts.find(a => a.level === "acil") || now.alerts[0];
  const li = xs => `<ul>${xs.map(t => `<li>${t}</li>`).join("")}</ul>`;
  const bugun = d.visits.filter(v => v.ts.slice(0, 10) === now.today);
  const saat = k => {
    const xs = bugun.filter(v => v.kind === k).map(v => hhmm(v.ts));
    return xs.length ? xs.join(" · ") : "–";
  };
  $("#health").innerHTML = (bad
    ? `<div class="state ${bad.level}"><span class="dot"></span>
         <div>Dikkat${li(now.alerts.map(a => a.text))}</div></div>`
    : `<div class="state ok"><span class="dot"></span>
         <div>Her şey yolunda${li(now.checks.map(c => c.text))}</div></div>`)
    + `<div class="tally">${tile("pee", "çiş", now.pee_today, saat("çiş"))}`
    + `${tile("poo", "kaka", now.poop_today, saat("kaka"))}</div>`;

  const A = {animate: first};
  drawChart($("#cVisits"), Object.assign({
    type: "bar", aria: "Günlük ziyaret sayısı", empty: "Henüz ziyaret yok.",
    points: byDay(d.visits).map(r => ({x: dmy(r.k), y: r.v, full: r.k})),
    tip: p => `<b>${p.y}</b> ziyaret`,
  }, A));

  drawChart($("#cDur"), Object.assign({
    type: "line", dark: true, aria: "Ziyaret başına toplam kalma süresi",
    empty: "Süre verisi yok.",
    points: d.visits.filter(x => x.secs != null).map(x => ({
      x: dmy(x.ts), y: x.secs, parts: x.parts,
      full: dmy(x.ts) + " " + hhmm(x.ts) + (x.parts > 1 ? ` · ${x.parts} giriş` : ""),
    })),
    yFmt: x => Math.round(x) + "s", tip: p => fmtS(p.y),
  }, A));

  drawChart($("#cWeight"), Object.assign({
    type: "line", aria: "Ağırlık okumaları", empty: "Ağırlık verisi yok.",
    points: d.weights.map(w => ({x: dmy(w.ts), y: w.kg, full: dmy(w.ts) + " " + hhmm(w.ts)})),
    tip: p => `<b>${p.y.toFixed(1)}</b> kg`,
  }, A));

  drawChart($("#cCleans"), Object.assign({
    type: "bar", aria: "Günlük temizlik döngüsü", empty: "Temizlik kaydı yok.",
    points: byDay(d.cleans).map(r => ({x: dmy(r.k), y: r.v, full: r.k})),
    tip: p => `<b>${p.y}</b> döngü`,
  }, A));

  const f = d.visits[0] || d.cleans[0];
  $("#foot").textContent = f
    ? `${dmy(f.ts)} tarihinden beri kayıtta · POOPY NANO 3`
    : "POOPY NANO 3";
  drawn = true;
}

function paintWhen() {
  const last = LAST && LAST.visits[LAST.visits.length - 1];
  if (!last) { $("#when").textContent = "henüz ziyaret yok"; return; }
  const io = last.parts > 1
    ? `<span class="inout"><b>${last.parts}</b> girişli · ${fmtS(last.secs)}</span>`
    : `<span class="inout">${fmtS(last.secs)}</span>`;
  $("#when").innerHTML = `son ziyaret ${ago(last.end || last.ts)}${io}`;
}

let lastJSON = null;
async function tick() {
  try {
    const txt = await (await fetch("api/data.json", {cache: "no-store"})).text();
    if (txt !== lastJSON) { lastJSON = txt; render(JSON.parse(txt)); }
    else paintWhen();
  } catch (e) { /* çevrimdışıyken son hal ekranda kalsın */ }
}
tick();
// ponytail: veri en iyi ihtimalle 6 dakikada bir değişiyor, o yüzden
// yoklama seyrek. Asıl tazeleme uygulamaya geri dönünce oluyor —
// iOS arka planda timer'ı zaten donduruyor.
setInterval(tick, 60000);
addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

$("#refresh").addEventListener("click", async e => {
  const b = e.currentTarget;
  b.dataset.busy = "1"; b.disabled = true;
  // ponytail: bulutu tetikleyemiyoruz (secret'lar Actions'ta), api/data.json'ı
  // cache'siz yeniden çekiyoruz. Buton en az 600 ms dönsün ki tıklama hissedilsin.
  await Promise.all([tick(), new Promise(r => setTimeout(r, 600))]);
  delete b.dataset.busy; b.disabled = false;
});

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
}), {rootMargin: "0px 0px -60px 0px"});
document.querySelectorAll(".reveal").forEach(n => io.observe(n));

let rt; addEventListener("resize", () => {
  clearTimeout(rt); rt = setTimeout(() => { if (LAST) { drawn = true; render(LAST); } }, 150);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
